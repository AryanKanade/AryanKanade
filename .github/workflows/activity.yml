name: Generate Activity Graph

on:
  schedule:
    - cron: "0 1 * * *"   # runs daily
  workflow_dispatch:       # lets you run it manually

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Build activity graph and stat cards
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > activity.js << 'EOF'
          const fs = require('fs');

          async function main() {
            const user = process.env.GH_USER;
            const DAYS = 30;

            // Public contribution calendar (the same data your profile heatmap shows)
            const res = await fetch(`https://github.com/users/${user}/contributions`, {
              headers: { 'User-Agent': 'Mozilla/5.0 activity-graph' },
            });
            if (!res.ok) throw new Error(`contributions page returned ${res.status}`);
            const html = await res.text();

            const cells = {};
            for (const m of html.matchAll(/data-date="(\d{4}-\d{2}-\d{2})"\s+id="([^"]+)"/g)) cells[m[2]] = { date: m[1], count: 0 };
            for (const m of html.matchAll(/<tool-tip[^>]*\sfor="([^"]+)"[^>]*>([^<]*)<\/tool-tip>/g)) {
              const c = cells[m[1]];
              if (!c) continue;
              const n = m[2].match(/^(\d+)\s+contribution/);
              c.count = n ? parseInt(n[1], 10) : 0;
            }
            const all = Object.values(cells).sort((a, b) => a.date.localeCompare(b.date));
            if (all.length === 0) throw new Error('could not parse contribution calendar');

            // last N days up to today (calendar may include future empty cells)
            const today = new Date().toISOString().slice(0, 10);
            const days = all.filter((d) => d.date <= today).slice(-DAYS);
            const counts = days.map((d) => d.count);
            const total = counts.reduce((a, b) => a + b, 0);
            const best = Math.max(...counts);
            const bestDay = days[counts.indexOf(best)];
            const activeDays = counts.filter((c) => c > 0).length;

            // ---- svg geometry ----
            const W = 840, H = 300;
            const L = 56, R = 28, T = 92, B = 52;
            const cw = W - L - R, ch = H - T - B;
            const yMax = Math.max(4, Math.ceil(best / 4) * 4);
            const x = (i) => L + (i * cw) / (days.length - 1);
            const y = (v) => T + ch - (v / yMax) * ch;
            const pts = counts.map((v, i) => [x(i), y(v)]);

            // smooth path (Catmull-Rom -> cubic bezier), clamped so it never dips below the axis
            const base = T + ch;
            const clampY = (v) => Math.min(base, Math.max(T, v));
            let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
            for (let i = 0; i < pts.length - 1; i++) {
              const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
              const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = clampY(p1[1] + (p2[1] - p0[1]) / 6);
              const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = clampY(p2[1] - (p3[1] - p1[1]) / 6);
              d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
            }
            const area = `${d} L ${pts[pts.length - 1][0].toFixed(1)} ${base} L ${pts[0][0].toFixed(1)} ${base} Z`;

            const fmt = (s) => { const dt = new Date(s + 'T00:00:00Z'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); };

            let grid = '';
            for (let g = 0; g <= 4; g++) {
              const v = (yMax / 4) * g, yy = y(v);
              grid += `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W - R}" y2="${yy.toFixed(1)}" stroke="#2a2e45" stroke-dasharray="${g === 0 ? '0' : '4 5'}"/>`;
              grid += `<text x="${L - 12}" y="${(yy + 4).toFixed(1)}" class="muted" text-anchor="end">${Math.round(v)}</text>`;
            }
            let xl = '';
            days.forEach((dd, i) => {
              if (i % 5 === 0 || i === days.length - 1) xl += `<text x="${x(i).toFixed(1)}" y="${H - 22}" class="muted" text-anchor="middle">${fmt(dd.date)}</text>`;
            });
            const dots = pts.map((p, i) => counts[i] > 0 ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#1a1b27" stroke="#a78bfa" stroke-width="2"/>` : '').join('');
            const bi = counts.indexOf(best);
            const peak = best > 0 ? `<circle cx="${pts[bi][0].toFixed(1)}" cy="${pts[bi][1].toFixed(1)}" r="5" fill="#38bdf8" stroke="#1a1b27" stroke-width="2"/>` : '';

            const stat = (px, label, value) => `<text x="${px}" y="40" class="big">${value}</text><text x="${px}" y="58" class="muted">${label}</text>`;

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Contribution activity for ${user}, last ${DAYS} days">
            <defs>
              <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
              <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.38"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
              <style>
                text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
                .title{font-size:18px;font-weight:700;fill:#c0caf5}
                .big{font-size:22px;font-weight:700;fill:#c0caf5}
                .muted{font-size:11px;fill:#787c99}
              </style>
            </defs>
            <rect x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="16" fill="#1a1b27" stroke="#2f3549"/>
            <rect x="${L}" y="24" width="4" height="40" rx="2" fill="url(#line)"/>
            <text x="${L + 16}" y="40" class="title">Contribution Activity</text>
            <text x="${L + 16}" y="58" class="muted">last ${DAYS} days · ${fmt(days[0].date)} – ${fmt(days[days.length - 1].date)}</text>
            ${stat(W - R - 270, 'CONTRIBUTIONS', total)}
            ${stat(W - R - 160, 'ACTIVE DAYS', activeDays + '/' + days.length)}
            ${stat(W - R - 50, 'BEST DAY', best)}
            ${grid}
            <path d="${area}" fill="url(#fill)"/>
            <path d="${d}" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            ${dots}
            ${peak}
            ${xl}
          </svg>`;

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/activity-graph.svg', svg);
            console.log({ total, activeDays, best, bestDay: bestDay.date, days: days.length });
          }
          main().catch((e) => { console.error(e); process.exit(1); });
          EOF
          cat > stats.js << 'EOF'
          const fs = require('fs');

          async function main() {
            const user = process.env.GH_USER;
            const token = process.env.GH_TOKEN;
            const apiHeaders = { 'User-Agent': 'stats-cards', Accept: 'application/vnd.github+json' };
            if (token) apiHeaders.Authorization = `Bearer ${token}`;
            const api = async (url) => {
              const r = await fetch(url, { headers: apiHeaders });
              if (!r.ok) throw new Error(`${r.status} ${url}`);
              return r.json();
            };

            // ---------- contribution calendar (same data as your profile heatmap) ----------
            const res = await fetch(`https://github.com/users/${user}/contributions`, { headers: { 'User-Agent': 'Mozilla/5.0 stats-cards' } });
            if (!res.ok) throw new Error(`contributions page returned ${res.status}`);
            const html = await res.text();
            const cells = {};
            for (const m of html.matchAll(/data-date="(\d{4}-\d{2}-\d{2})"\s+id="([^"]+)"/g)) cells[m[2]] = { date: m[1], count: 0 };
            for (const m of html.matchAll(/<tool-tip[^>]*\sfor="([^"]+)"[^>]*>([^<]*)<\/tool-tip>/g)) {
              const c = cells[m[1]];
              if (!c) continue;
              const n = m[2].match(/^(\d+)\s+contribution/);
              c.count = n ? parseInt(n[1], 10) : 0;
            }
            const today = new Date().toISOString().slice(0, 10);
            const days = Object.values(cells).filter((d) => d.date <= today).sort((a, b) => a.date.localeCompare(b.date));
            if (!days.length) throw new Error('could not parse contribution calendar');

            const total = days.reduce((s, d) => s + d.count, 0);
            const activeDays = days.filter((d) => d.count > 0).length;

            // streaks
            let longest = { len: 0, start: null, end: null }, run = { len: 0, start: null };
            for (const d of days) {
              if (d.count > 0) {
                if (run.len === 0) run.start = d.date;
                run.len++;
                if (run.len > longest.len) longest = { len: run.len, start: run.start, end: d.date };
              } else run = { len: 0, start: null };
            }
            let idx = days.length - 1;
            if (days[idx].count === 0) idx--; // today not over yet, doesn't break the streak
            let cur = { len: 0, start: null, end: idx >= 0 ? days[idx].date : null };
            while (idx >= 0 && days[idx].count > 0) { cur.len++; cur.start = days[idx].date; idx--; }
            if (cur.len === 0) cur = { len: 0, start: null, end: null };

            // ---------- profile + repos ----------
            let profile = { followers: 0, public_repos: 0 };
            let repos = [];
            try {
              profile = await api(`https://api.github.com/users/${user}`);
              for (let p = 1; p <= 5; p++) {
                const page = await api(`https://api.github.com/users/${user}/repos?per_page=100&page=${p}&type=owner`);
                repos.push(...page);
                if (page.length < 100) break;
              }
            } catch (e) { console.warn('repo data unavailable:', e.message); }
            const own = repos.filter((r) => !r.fork);
            const stars = own.reduce((s, r) => s + r.stargazers_count, 0);

            const bytes = {};
            for (const r of own) {
              try {
                const l = await api(`https://api.github.com/repos/${user}/${r.name}/languages`);
                for (const [k, v] of Object.entries(l)) bytes[k] = (bytes[k] || 0) + v;
              } catch (e) { if (r.language) bytes[r.language] = (bytes[r.language] || 0) + 1000; }
            }
            const langs = Object.entries(bytes).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const langTotal = Object.values(bytes).reduce((a, b) => a + b, 0) || 1;

            // ---------- shared svg bits (tokyonight look) ----------
            const C = { bg: '#1a1b27', border: '#2f3549', title: '#70a5fd', text: '#38bdae', icon: '#bf91f3', purple: '#bf91f3', blue: '#70a5fd' };
            const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
            const fmtDate = (s) => new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
            const fmtFull = (s) => new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
            const range = (a, b) => (a && b ? (a === b ? fmtDate(a) : `${fmtDate(a)} - ${fmtDate(b)}`) : 'No streak yet');
            const frame = (W, H, inner, title) => `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
            <style>
              text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
              .title{font-size:19px;font-weight:600;fill:${C.title}}
              .row{font-size:14px;font-weight:600;fill:${C.text}}
              .num{font-size:14px;font-weight:700;fill:${C.text}}
              .big{font-size:30px;font-weight:700;fill:${C.blue}}
              .bigp{font-size:34px;font-weight:700;fill:${C.purple}}
              .lab{font-size:14px;fill:${C.blue}}
              .labp{font-size:14px;font-weight:700;fill:${C.purple}}
              .date{font-size:12px;fill:${C.text}}
              .leg{font-size:12px;fill:${C.text}}
            </style>
            <rect x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="4.5" fill="${C.bg}" stroke="${C.border}"/>
            ${inner}
          </svg>`;
            const icon = (d, x, y) => `<svg x="${x}" y="${y}" width="16" height="16" viewBox="0 0 16 16"><path fill="${C.icon}" fill-rule="evenodd" d="${d}"/></svg>`;
            const ICONS = {
              star: 'M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z',
              history: 'M1.643 3.143.427 1.927A.25.25 0 0 0 0 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 0 0 .177-.427L2.715 4.215a6.5 6.5 0 1 1-1.18 4.458.75.75 0 1 0-1.493.154 8.001 8.001 0 1 0 1.6-5.684ZM7.75 4a.75.75 0 0 1 .75.75v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.751.751 0 0 1 7 8.25v-3.5A.75.75 0 0 1 7.75 4Z',
              calendar: 'M4.75 0a.75.75 0 0 1 .75.75V2h5V.75a.75.75 0 0 1 1.5 0V2h1.25c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 13.25 16H2.75A1.75 1.75 0 0 1 1 14.25V3.75C1 2.784 1.784 2 2.75 2H4V.75A.75.75 0 0 1 4.75 0ZM2.5 7.5v6.75c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25V7.5Zm10.75-4H2.75a.25.25 0 0 0-.25.25V6h11V3.75a.25.25 0 0 0-.25-.25Z',
              repo: 'M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z',
              people: 'M2 5.5a3.5 3.5 0 1 1 5.898 2.549 5.508 5.508 0 0 1 3.034 4.084.75.75 0 1 1-1.482.235 4 4 0 0 0-7.9 0 .75.75 0 0 1-1.482-.236A5.507 5.507 0 0 1 3.102 8.05 3.493 3.493 0 0 1 2 5.5ZM11 4a3.001 3.001 0 0 1 2.22 5.018 5.01 5.01 0 0 1 2.56 3.012.749.749 0 0 1-.885.954.752.752 0 0 1-.549-.514 3.507 3.507 0 0 0-2.522-2.372.75.75 0 0 1-.574-.73v-.352a.75.75 0 0 1 .416-.672A1.5 1.5 0 0 0 11 5.5.75.75 0 0 1 11 4Zm-5.5-.5a2 2 0 1 0-.001 3.999A2 2 0 0 0 5.5 3.5Z',
            };

            // ---------- 1) stats card ----------
            const W = 480;
            const rows = [
              ['star', 'Total Stars Earned:', stars],
              ['history', 'Contributions (last year):', total],
              ['calendar', 'Active Days (last year):', activeDays],
              ['repo', 'Public Repos:', own.length || profile.public_repos],
              ['people', 'Followers:', profile.followers],
            ];
            let statRows = '';
            rows.forEach(([ic, label, value], i) => {
              const y = 74 + i * 28;
              statRows += `${icon(ICONS[ic], 28, y - 13)}<text x="54" y="${y}" class="row">${label}</text><text x="300" y="${y}" class="num">${value}</text>`;
            });
            const pct = Math.round((activeDays / days.length) * 100);
            const rc = 2 * Math.PI * 40;
            const statsSvg = frame(W, 200, `
            <text x="28" y="38" class="title">${esc(user)}'s GitHub Stats</text>
            ${statRows}
            <g transform="translate(398,112)">
              <circle r="40" fill="none" stroke="#2a2f4a" stroke-width="6"/>
              <circle r="40" fill="none" stroke="${C.blue}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(rc * pct / 100).toFixed(1)} ${rc.toFixed(1)}" transform="rotate(-90)"/>
              <text y="8" class="big" text-anchor="middle" style="font-size:24px;fill:${C.text}">${pct}%</text>
              <text y="58" class="date" text-anchor="middle">active</text>
            </g>`, `GitHub stats for ${user}`);

            // ---------- 2) streak card ----------
            const circ = 2 * Math.PI * 40;
            const flame = `<path fill="${C.blue}" d="M0 -9 C2 -5 6 -3 6 2 C6 6 3 9 0 9 C-3 9 -6 6 -6 2 C-6 -1 -4 -3 -3 -5 C-2 -3 -1 -2 0 -3 C1 -5 0 -7 0 -9 Z"/>`;
            const first = fmtFull(days[0].date);
            const streakSvg = frame(W, 200, `
            <g text-anchor="middle">
              <text x="80" y="104" class="big">${total}</text>
              <text x="80" y="134" class="lab">Total Contributions</text>
              <text x="80" y="158" class="date">${first} - Present</text>
            </g>
            <line x1="160" y1="40" x2="160" y2="160" stroke="#dfe3f0" stroke-width="1" opacity="0.85"/>
            <g transform="translate(240,86)">
              <circle r="40" fill="none" stroke="${C.blue}" stroke-width="5" stroke-dasharray="${(circ * 0.9).toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round" transform="rotate(-72)"/>
              <text y="12" class="bigp" text-anchor="middle">${cur.len}</text>
              <g transform="translate(0,-40)">${flame}</g>
            </g>
            <g text-anchor="middle">
              <text x="240" y="152" class="labp">Current Streak</text>
              <text x="240" y="174" class="date">${cur.len ? range(cur.start, cur.end) : 'No streak yet'}</text>
            </g>
            <line x1="320" y1="40" x2="320" y2="160" stroke="#dfe3f0" stroke-width="1" opacity="0.85"/>
            <g text-anchor="middle">
              <text x="400" y="104" class="big">${longest.len}</text>
              <text x="400" y="134" class="lab">Longest Streak</text>
              <text x="400" y="158" class="date">${range(longest.start, longest.end)}</text>
            </g>`, `Contribution streaks for ${user}`);

            // ---------- 3) languages card ----------
            const colors = { JavaScript: '#f1e05a', Java: '#b07219', Python: '#3572A5', HTML: '#e34c26', CSS: '#663399', C: '#a8b9cc', 'C++': '#f34b7d', TypeScript: '#3178c6', Dart: '#00B4AB', Kotlin: '#A97BFF', Shell: '#89e051', EJS: '#a91e50', SCSS: '#c6538c', 'Jupyter Notebook': '#DA5B0B' };
            const fb = ['#7c3aed', '#38bdf8', '#f472b6', '#34d399', '#fbbf24', '#fb923c'];
            const top = Object.entries(bytes).sort((a, b) => b[1] - a[1]).slice(0, 6);
            const topTotal = top.reduce((a, l) => a + l[1], 0) || 1;
            const barX = 28, barW = W - 56;
            let seg = '', off = 0, legend = '';
            top.forEach(([name, b], i) => {
              const w = (b / topTotal) * barW, c = colors[name] || fb[i % fb.length];
              seg += `<rect x="${(barX + off).toFixed(1)}" y="54" width="${Math.max(w, 1).toFixed(1)}" height="9" fill="${c}"/>`;
              off += w;
              const col = i % 2, row = Math.floor(i / 2);
              legend += `<circle cx="${34 + col * 220}" cy="${96 + row * 22}" r="5" fill="${c}"/><text x="${46 + col * 220}" y="${100 + row * 22}" class="leg">${esc(name)} ${((b / topTotal) * 100).toFixed(2)}%</text>`;
            });
            if (!top.length) legend = `<text x="28" y="100" class="leg">No language data yet</text>`;
            const rowsN = Math.max(1, Math.ceil(top.length / 2));
            const langSvg = frame(W, 96 + rowsN * 22 + 16, `
            <text x="28" y="38" class="title">Most Used Languages</text>
            <clipPath id="bar"><rect x="${barX}" y="54" width="${barW}" height="9" rx="4.5"/></clipPath>
            <g clip-path="url(#bar)">${seg}</g>
            ${legend}`, `Top languages for ${user}`);

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/stats-card.svg', statsSvg);
            fs.writeFileSync('dist/streak-card.svg', streakSvg);
            fs.writeFileSync('dist/langs-card.svg', langSvg);
            console.log({ total, activeDays, cur, longest, stars, repos: own.length, langs: top.map((l) => l[0]) });
          }
          main().catch((e) => { console.error(e); process.exit(1); });
          EOF
          node activity.js
          node stats.js

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
