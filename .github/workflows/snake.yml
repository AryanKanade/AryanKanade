name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:       # lets you run it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0284c7&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed&sizeDotBorderRadius=4&sizeCell=16&sizeDot=12
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#1f2335,#3b2f7a,#5b45b8,#7c5ce6,#a78bfa&sizeDotBorderRadius=4&sizeCell=16&sizeDot=12

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
